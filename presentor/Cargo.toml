[package]
name = "presentor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
axum = { version = "0.8.8", features = ["macros"] }
chrono = "0.4.43"
getrandom = "0.4.1"
libc = "0.2.180"
log = "0.4.29"
log4rs = "1.4.0"
reqwest = "0.13.2"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "signal"] }
tower-http = { version = "0.6.8", features = ["fs"] }

[features]
mixer = []
